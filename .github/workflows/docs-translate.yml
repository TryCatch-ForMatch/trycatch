name: Docs Auto Translate

# Traduz automaticamente apenas o README.
#
# O CONTRIBUTING.md ficou de fora de propósito: ele é o documento operacional,
# cheio de tabelas, âncoras de índice, comandos e nomes de arquivo. A tradução
# automática quebra esse tipo de estrutura — traduz conteúdo dentro de blocos de
# código e desalinha os links do índice. O CONTRIBUTING.en.md é mantido à mão,
# junto com a versão em português, no mesmo pull request.
on:
  push:
    branches:
      - main
    paths:
      - 'README.md'

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, 'auto-translate')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install translate-shell
        run: sudo apt-get update && sudo apt-get install -y translate-shell

      - name: Translate README to English
        run: |
          if [ -f README.md ]; then
            trans -b :en < README.md > README.en.md
            echo "README translated."
          fi

      - name: Commit translated file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Apenas o README — o CONTRIBUTING.en.md e mantido a mao
          git add README.en.md

          git commit -m "docs: auto-translate README to English [skip ci]" || echo "No changes"
          git push origin HEAD:main
