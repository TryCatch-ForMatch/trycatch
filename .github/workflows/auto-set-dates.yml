name: Auto Set Project Dates

on:
  push:
    branches:
      - main
      - develop
      - fix/**

jobs:
  update-project-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update GitHub Project dates automatically
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectNumber = 4; // número do seu projeto no GitHub Projects

            // Query GraphQL corrigida (sem tipos antigos)
            const projectQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  projectV2(number: $number) {
                    id
                    title
                    items(first: 100) {
                      nodes {
                        id
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              field { name }
                              date
                            }
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field { name }
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(projectQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: projectNumber
            });

            console.log("✅ Project data fetched successfully:", data.repository.projectV2.title);

            // Exemplo de lógica (ajuste conforme seu uso real)
            const projectId = data.repository.projectV2.id;
            console.log(`Project ID: ${projectId}`);

            // Aqui você poderia atualizar campos ou datas conforme necessidade
            // Exemplo:
            // await github.graphql(`mutation { ... }`);
