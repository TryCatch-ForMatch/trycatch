name: '🧠 Spike (Pesquisa Técnica)'
description: 'Investigação ou validação técnica.'
title: '[SPIKE] '
labels: ['spike']
assignees: []
body:
  - type: textarea
    id: objetivo
    attributes:
      label: '🎯 Objetivo da Pesquisa'
      description: 'Explique o que precisa ser investigado.'
      placeholder: 'Ex.: Avaliar se Prisma suporta soft delete nativo.'
    validations:
      required: true

  - type: textarea
    id: perguntas
    attributes:
      label: '❓ Perguntas a Responder'
      placeholder: |
        - Existe suporte nativo?
        - Qual impacto em performance?
        - Existem alternativas melhores?
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: '🧠 Contexto Técnico'
      placeholder: 'Ex.: Precisamos evitar exclusão física de registros por questão de auditoria.'
    validations:
      required: true

  - type: textarea
    id: resultado
    attributes:
      label: '📄 Resultado Esperado'
      placeholder: 'Documento com conclusão técnica e recomendação final.'
    validations:
      required: true

  - type: textarea
    id: contribuidores
    attributes:
      label: '🙌 Torne-se um colaborador'
      placeholder: '@all-contributors please add @SEU_USUARIO for research'