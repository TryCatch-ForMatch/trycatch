name: ✍️ Tarefa Simples
description: Uma tarefa direta, como a criação de um componente ou a correção de algo pequeno.
title: "[TASK]"
labels: ['task']
assignees: []
body:
  - type: textarea
    id: descricao
    attributes:
      label: "📝 Descrição"
      description: "Descreva a tarefa em uma ou duas frases. O que precisa ser feito?"
      placeholder: "Ex: Criar o componente de botão conforme Figma."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: "✅ Critérios de Conclusão"
      description: "Como saberemos que a tarefa foi concluída com sucesso?"
      placeholder: "Ex: O botão deve estar funcionando e seguir o design."
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: "📎 Contexto"
      description: "Adicione qualquer link útil (Figma, documentação, etc.) ou informação extra."
      placeholder: "Links, instruções, prints, etc."
    validations:
      required: false
