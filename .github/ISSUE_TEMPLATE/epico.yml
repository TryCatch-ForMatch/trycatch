name: '📦 Épico'
description: 'Iniciativa ampla que agrupa múltiplas issues relacionadas.'
title: '[ÉPICO] '
labels: ['epic']
assignees: []
body:
  - type: textarea
    id: objetivo
    attributes:
      label: '🎯 Objetivo Estratégico'
      description: 'Qual problema amplo este Épico resolve?'
      placeholder: 'Ex.: Reformular a Gestão de Projetos para suportar validação de percentual de stacks.'
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: '📌 Contexto'
      description: 'Por que essa iniciativa é necessária agora?'
      placeholder: 'Ex.: O modelo atual permite percentuais acima de 100%, causando inconsistência.'
    validations:
      required: true

  - type: textarea
    id: escopo
    attributes:
      label: '📦 Escopo Geral'
      description: 'Quais áreas serão impactadas?'
      placeholder: 'Ex.: Backend (validação), Frontend (mensagem de erro), Documentação.'
    validations:
      required: true

  - type: textarea
    id: metricas
    attributes:
      label: '📊 Métricas de Sucesso'
      description: 'Como saberemos que o Épico foi bem-sucedido?'
      placeholder: 'Ex.: Nenhum projeto poderá ser salvo com percentual diferente de 100%.'
    validations:
      required: false

  - type: textarea
    id: contribuidores
    attributes:
      label: '🙌 Torne-se um colaborador'
      description: |
        Após a aprovação e merge desta issue/PR, adicione o seguinte comentário nesta issue para registrar sua contribuição:

        @all-contributors please add @SEU_USUARIO for code

        Substitua @SEU_USUARIO pelo seu usuário do GitHub e inclua a categoria.

        Caso sua contribuição não seja apenas código, consulte as categorias disponíveis:
        https://allcontributors.org/docs/en/emoji-key
