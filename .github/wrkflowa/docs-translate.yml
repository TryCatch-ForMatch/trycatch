name: Docs Auto Translate

on:
  push:
    paths:
      - 'README.md'

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, 'auto-translate')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install translate-shell
        run: sudo apt-get update && sudo apt-get install -y translate-shell

      - name: Translate README.md to English
        run: |
          trans -b :en < README.md > README-EN.md
          echo "Translation complete."

      - name: Commit translated file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README-EN.md
          git commit -m "docs: auto-translate README to English" || echo "No changes"
          git push
