version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ContTrycatch_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - volume_TryCatch:/var/lib/postgresql/data
    restart: always

volumes:
  volume_TryCatch: